services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    ipc: host
    shm_size: "16gb"
    environment:
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env}
      MODEL_ID: ${MODEL_ID:-modaic/mo-1.1-fp8}
      MODEL_REVISION: ${MODEL_REVISION:-b9a691fbfd931e6a4bb5bde3a70276ace0c7337f}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-mo}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-32768}
      VLLM_MAX_NUM_BATCHED_TOKENS: ${VLLM_MAX_NUM_BATCHED_TOKENS:-65536}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-128}
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env}
      MODEL_ID: ${MODEL_ID:-modaic/mo-1.1-fp8}
      MODEL_REVISION: ${MODEL_REVISION:-b9a691fbfd931e6a4bb5bde3a70276ace0c7337f}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-mo}
      VLLM_BASE_URL: http://vllm:8000
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      MO_API_KEY: ${MO_API_KEY:-}
      MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-32768}
    ports:
      - "8080:8080"
    depends_on:
      - vllm
