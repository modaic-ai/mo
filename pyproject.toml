[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mo-decision-server"
version = "0.1.0"
description = "Exact JSON decision-model gateway for the merged Modaic Mo checkpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "transformers==5.14.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
publish = [
  "huggingface-hub>=1.1,<2",
  "modal>=1.2,<2",
]

[project.scripts]
mo-api = "mo.api:main"
mo-smoke = "mo.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
